server.port=8082
spring.application.name=ai-recipe-service

# This service is stateless — no database.

# ============================================================
# JWT (RS256): ai-recipe-service only VERIFIES customer tokens,
# so it holds the auth-service public key alone.
# ============================================================
jwt.public-key=${JWT_PUBLIC_KEY:classpath:keys/jwt-public.pem}

# ============================================================
# AI provider: Groq (free, OpenAI-compatible). Get a free key at
# https://console.groq.com and set GROQ_API_KEY in the environment.
# Swap base-url/model to point at OpenAI, a local Ollama, etc.
# ============================================================
groq.api-key=${GROQ_API_KEY:}
groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
